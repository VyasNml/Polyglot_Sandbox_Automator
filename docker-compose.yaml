services:

  api:
    build:
      context: .
      dockerfile: containers/api/Dockerfile

    ports:
      - "3000:3000"

    environment:
      WORKSPACE_VOLUME: 260522_polyglot_sandbox_automator_workspace-data

    volumes:
      - .:/app
      - workspace-data:/workspace
      - /app/node_modules
      - /var/run/docker.sock:/var/run/docker.sock

    depends_on:
      - redis

  redis:
    image: redis:7-alpine

    ports:
      - "6379:6379"

volumes:
  workspace-data: