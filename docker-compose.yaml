services:

  api:
    build:
      context: .
      dockerfile: containers/api/Dockerfile

    ports:
      - "3000:3000"

    volumes:
      - .:/app
      - /app/node_modules
      - /var/run/docker.sock:/var/run/docker.sock

    depends_on:
      - redis

  redis:
    image: redis:7-alpine

    ports:
      - "6379:6379"